databaseChangeLog:
  - changeSet:
      id: 001-create-repo-table
      author: neqro
      changes:
        - createTable:
            tableName: repositories
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: full_name
                  type: varchar(100)
                  constraints:
                    unique: true
                    nullable: false
              - column:
                  name: description
                  type: varchar(255)
              - column:
                  name: clone_url
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: stars
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: createdAt
                  type: date
                  constraints:
                    nullable: false
              - column:
                  name: owner
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: bigint